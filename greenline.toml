# greenline gate configuration — committed to the repo.
# See docs/greenline.md and DOCTRINE.md (installed by `greenline setup`) for the
# workflow and invariants. main == deployed == green, always.
contract_version = 1
main_branch = "master"

# Verdict command. cwd = the worktree being gated. ./run check selects legs
# from the candidate diff and fails closed to the full suite on an unknown
# path. The Go leg (build + vet + tests) still needs the macmini-ollama-tunnel
# auto service (localhost:11434 and :11435) or TestRemote* fails.
check = "./run check"

# Deploy command. cwd = the canonical checkout. Drain-gated redeploy to spark;
# idempotent. NEVER use DEPLOY_FORCE=1 (it skips the drain and can kill in-flight
# work). The drain wait is bounded at 120s so the release always fits the 600s
# end-to-end deadline: a multi-tens-of-minutes denoise chunk is never waited
# out, it is requeued by the shutdown path and reruns after the bounce.
deploy = "./run deploy"

# Optional health-only probe. Empty = re-run `deploy` as the health probe.
health = ""

# Informational: the auto/service name this repo deploys (on spark).
service = "arbiter"

# Persistent worktree base for this repo (gate lives at <base>/gate).
worktree_base = "~/src/.greenline-worktrees/arbiter"
